<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101511">
  <title>MRCS Drinks | Orçamento para casamento</title>
  <style>
    :root {
      --bg: #101511;
      --panel: #19211b;
      --panel2: #202a22;
      --gold: #d2b16d;
      --green: #8eae87;
      --text: #f5f3ec;
      --muted: #c0c8bd;
      --line: #3b493d;
      --danger: #ffb4a9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(ellipse at top, #243328 0, var(--bg) 55%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    .wrap {
      width: min(920px, calc(100% - 28px));
      margin: 28px auto 52px;
    }

    header {
      text-align: center;
      padding: 24px 12px 28px;
    }

    .brand {
      color: var(--gold);
      letter-spacing: .22em;
      font-size: clamp(1.25rem, 4vw, 2rem);
      font-weight: 800;
    }

    .rule {
      width: 78px;
      height: 2px;
      margin: 14px auto;
      background: var(--gold);
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2.15rem);
      margin: 0 0 10px;
    }

    header p {
      max-width: 650px;
      margin: 0 auto;
      color: var(--muted);
    }

    form {
      display: grid;
      gap: 18px;
    }

    fieldset {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
      margin: 0;
      background: rgba(25,33,27,.94);
    }

    legend {
      padding: 0 10px;
      color: var(--gold);
      font-size: 1.12rem;
      font-weight: 750;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
